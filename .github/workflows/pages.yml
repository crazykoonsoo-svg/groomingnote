name: Publish GroomingNote to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Validate built site
        shell: bash
        run: |
          set -euo pipefail
          test -s _site/index.html
          test -s _site/sitemap.xml
          test -s _site/rss.xml
          if find _site -type l -print -quit | grep -q .; then
            echo '::error::Symbolic links are not supported in Pages artifacts.'
            exit 1
          fi
          if grep -Eq '\{%|\{\{' _site/index.html; then
            echo '::error::Unrendered Liquid found in the home page.'
            exit 1
          fi
          du -sh _site
          find _site -type f | wc -l
      - name: Upload built site only
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
