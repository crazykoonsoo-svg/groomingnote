<a class="post-card" href="{{ article.path }}"><div class="post-thumb"><img width="{{ article.width }}" height="{{ article.height }}" src="{{ article.image }}" alt="{{ article.alt | escape }}" loading="lazy"></div><div class="post-body"><span class="post-cat">{{ article.card_label | escape }}</span><h3>{{ article.title | escape }}</h3></div></a>
